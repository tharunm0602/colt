parameters:
  - name: workingDirectory
    type: string
  - name: planFile
    type: string
    default: 'tfplan'
  - name: varFile
    type: string
    default: 'terraform.tfvars'

steps:
  - task: Bash@3
    displayName: 'Terraform Plan'
    inputs:
      targetType: 'inline'
      workingDirectory: '${{ parameters.workingDirectory }}'
      script: |
        set -e
        echo "Creating Terraform plan..."
        terraform plan \
          -var-file="${{ parameters.varFile }}" \
          -out=${{ parameters.planFile }} \
          -input=false
    env:
      GOOGLE_CREDENTIALS: $(gcp-service-account-key)

  - task: Bash@3
    displayName: 'Show Plan Summary'
    inputs:
      targetType: 'inline'
      workingDirectory: '${{ parameters.workingDirectory }}'
      script: |
        echo "Terraform Plan Summary:"
        terraform show -no-color ${{ parameters.planFile }}

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Plan Artifact'
    inputs:
      targetPath: '${{ parameters.workingDirectory }}/${{ parameters.planFile }}'
      artifactName: 'terraform-plan-${{ parameters.workingDirectory }}'
      publishLocation: 'pipeline'
