trigger: none  # Manual trigger only for bootstrap

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: gcp-bootstrap-vars
  - name: TF_VERSION
    value: '1.6.0'
  - name: GCP_PROJECT_ID
    value: 'colt-sbx-infra-001'
  - name: GCP_REGION
    value: 'us-central1'

stages:
  - stage: CreateBackendBucket
    displayName: 'Create Backend Bucket'
    jobs:
      - job: CreateBucket
        displayName: 'Create GCS Backend Bucket'
        steps:
          - template: templates/setup-terraform.yml
            parameters:
              terraformVersion: $(TF_VERSION)

          - task: Bash@3
            displayName: 'Create Backend Bucket'
            inputs:
              targetType: 'filePath'
              filePath: '$(Build.SourcesDirectory)/scripts/create-backend-bucket.sh'
            env:
              GCP_PROJECT_ID: $(GCP_PROJECT_ID)
              GCP_REGION: $(GCP_REGION)
              GOOGLE_CREDENTIALS: $(gcp-service-account-key)

  - stage: BootstrapFolder
    displayName: 'Bootstrap - Create Folder'
    dependsOn: CreateBackendBucket
    jobs:
      - job: DeployFolder
        displayName: 'Deploy Sandbox Folder'
        steps:
          - template: templates/setup-terraform.yml
            parameters:
              terraformVersion: $(TF_VERSION)

          - template: templates/terraform-init.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/folder'

          - template: templates/terraform-validate.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/folder'

          - template: templates/terraform-plan.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/folder'
              planFile: 'folder.tfplan'

          - template: templates/terraform-apply.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/folder'
              planFile: 'folder.tfplan'

  - stage: BootstrapProject
    displayName: 'Bootstrap - Create Project'
    dependsOn: BootstrapFolder
    jobs:
      - job: DeployProject
        displayName: 'Deploy Sandbox Project'
        steps:
          - template: templates/setup-terraform.yml
            parameters:
              terraformVersion: $(TF_VERSION)

          - template: templates/terraform-init.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/project'

          - template: templates/terraform-validate.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/project'

          - template: templates/terraform-plan.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/project'
              planFile: 'project.tfplan'

          - template: templates/terraform-apply.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/project'
              planFile: 'project.tfplan'

  - stage: BootstrapGCS
    displayName: 'Bootstrap - Create State Bucket'
    dependsOn: BootstrapProject
    jobs:
      - job: DeployGCS
        displayName: 'Deploy Terraform State Bucket'
        steps:
          - template: templates/setup-terraform.yml
            parameters:
              terraformVersion: $(TF_VERSION)

          - template: templates/terraform-init.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/gcs'

          - template: templates/terraform-validate.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/gcs'

          - template: templates/terraform-plan.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/gcs'
              planFile: 'gcs.tfplan'

          - template: templates/terraform-apply.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/gcs'
              planFile: 'gcs.tfplan'

  - stage: BootstrapServiceAccount
    displayName: 'Bootstrap - Create Service Account'
    dependsOn: BootstrapProject
    jobs:
      - job: DeployServiceAccount
        displayName: 'Deploy Bootstrap Service Account'
        steps:
          - template: templates/setup-terraform.yml
            parameters:
              terraformVersion: $(TF_VERSION)

          - template: templates/terraform-init.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/service-account'

          - template: templates/terraform-validate.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/service-account'

          - template: templates/terraform-plan.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/service-account'
              planFile: 'sa.tfplan'

          - template: templates/terraform-apply.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/service-account'
              planFile: 'sa.tfplan'

  - stage: BootstrapWIF
    displayName: 'Bootstrap - Create Workload Identity Federation'
    dependsOn: BootstrapServiceAccount
    jobs:
      - job: DeployWIF
        displayName: 'Deploy WIF for Azure DevOps'
        steps:
          - template: templates/setup-terraform.yml
            parameters:
              terraformVersion: $(TF_VERSION)

          - template: templates/terraform-init.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/wif'

          - template: templates/terraform-validate.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/wif'

          - template: templates/terraform-plan.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/wif'
              planFile: 'wif.tfplan'

          - template: templates/terraform-apply.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/wif'
              planFile: 'wif.tfplan'

          - task: Bash@3
            displayName: 'Output WIF Configuration'
            inputs:
              targetType: 'inline'
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/wif'
              script: |
                echo "========================================"
                echo "Workload Identity Federation Setup"
                echo "========================================"
                echo ""
                echo "Use these values to configure Azure DevOps Service Connection:"
                echo ""
                terraform output -json

  - stage: BootstrapFolderIAM
    displayName: 'Bootstrap - Configure Folder IAM'
    dependsOn: BootstrapFolder
    jobs:
      - job: DeployFolderIAM
        displayName: 'Deploy Folder-Level IAM Bindings'
        steps:
          - template: templates/setup-terraform.yml
            parameters:
              terraformVersion: $(TF_VERSION)

          - template: templates/terraform-init.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/folder-iam'

          - template: templates/terraform-validate.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/folder-iam'

          - template: templates/terraform-plan.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/folder-iam'
              planFile: 'folder-iam.tfplan'

          - template: templates/terraform-apply.yml
            parameters:
              workingDirectory: '$(Build.SourcesDirectory)/bootstrap/folder-iam'
              planFile: 'folder-iam.tfplan'
