steps:
  # 1. Fetch Git History using Substitution Token
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        if [ -z "${_GITHUB_TOKEN}" ]; then
          echo "ERROR: _GITHUB_TOKEN is not set in Trigger Substitutions."
          exit 1
        fi
        
        echo "Configuring git authentication..."
        git config --global url."https://x-access-token:${_GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        
        echo "Initializing build for commit ${COMMIT_SHA}..."
        git fetch --depth=2 origin ${COMMIT_SHA}
        git checkout ${COMMIT_SHA}
    id: 'fetch-history'

  # 2. Detect Changed Directories
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        git diff --name-only HEAD~1 HEAD > changed_files.txt
        grep -E "\.(tf|tfvars)$" changed_files.txt | xargs -I {} dirname {} | sort | uniq > changed_dirs.txt || true
        
        if [ ! -s changed_dirs.txt ]; then
          echo "No Terraform changes detected."
        else
          echo "Detected Terraform changes in:"
          cat changed_dirs.txt
        fi
    id: 'detect-changes'

  # 3. Comprehensive Checks (Format, Trivy, TFLint, Plan)
  - name: 'google/cloud-sdk:latest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Install Tools
        apt-get update && apt-get install -y wget gnupg software-properties-common curl unzip
        wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | tee /etc/apt/sources.list.d/hashicorp.list
        apt-get update && apt-get install terraform -y
        curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | tee /usr/share/keyrings/trivy.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -cs) main" | tee /etc/apt/sources.list.d/trivy.list
        apt-get update && apt-get install trivy -y

        # Prepare Log File
        LOG_FILE="terraform_plan_${BUILD_ID}.log"
        echo "--- Terraform Build Log ---" > $$LOG_FILE
        
        if [ ! -s changed_dirs.txt ]; then
          echo "No changes to process." >> $$LOG_FILE
          exit 0
        fi

        for DIR in $(cat changed_dirs.txt); do
          if [ -d "$$DIR" ]; then
            echo "------------------------------------------------" | tee -a $$LOG_FILE
            echo "Module: $$DIR" | tee -a $$LOG_FILE
            
            terraform -chdir="$$DIR" fmt -check 2>&1 | tee -a $$LOG_FILE || true
            trivy config "$$DIR" 2>&1 | tee -a $$LOG_FILE || true
            (cd "$$DIR" && tflint --init && tflint) 2>&1 | tee -a $$LOG_FILE || true
            (cd "$$DIR" && terraform init -input=false -no-color && terraform plan -input=false -no-color -out=tfplan) 2>&1 | tee -a $$LOG_FILE || true
          fi
        done

        # Upload Log
        gsutil cp $$LOG_FILE gs://build_logs_001/cloud-build/$$LOG_FILE
    id: 'terraform-checks'

# Top-level configuration
logsBucket: 'gs://build_logs_001'

options:
  logging: GCS_ONLY
