steps:
  # 1. Fetch Git History
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        echo "Initializing build for commit ${COMMIT_SHA}..."
        git fetch --depth=2 origin ${COMMIT_SHA}
        git checkout ${COMMIT_SHA}
    id: 'fetch-history'

  # 2. Detect Changed Directories
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        git diff --name-only HEAD~1 HEAD > changed_files.txt
        grep "\.tf$" changed_files.txt | xargs -I {} dirname {} | sort | uniq > changed_dirs.txt || true
        
        echo "Detected Terraform changes in $(wc -l < changed_dirs.txt) directories."
    id: 'detect-changes'

  # 3. Code Scanning (TFLint)
  - name: 'ghcr.io/terraform-linters/tflint'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e
        if [ ! -s changed_dirs.txt ]; then
          echo "No Terraform changes detected. Skipping linting."
          exit 0
        fi

        for DIR in $(cat changed_dirs.txt); do
          if [ -d "$$DIR" ]; then
            echo "Starting TFLint for: $$DIR"
            cd "$$DIR"
            tflint --init
            tflint
            cd - > /dev/null
          fi
        done
    id: 'tflint'

  # 4. Terraform Init and Plan
  - name: 'hashicorp/terraform:latest'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e
        if [ ! -s changed_dirs.txt ]; then
          echo "No Terraform changes detected. Skipping plan."
          exit 0
        fi

        for DIR in $(cat changed_dirs.txt); do
          if [ -d "$$DIR" ]; then
            echo "------------------------------------------------"
            echo "Processing Module: $$DIR"
            cd "$$DIR"
            if ls *.tf 1> /dev/null 2>&1; then
              echo "Running 'terraform init'..."
              terraform init -input=false -no-color
              echo "Running 'terraform plan'..."
              terraform plan -input=false -no-color -out=tfplan
              echo "Plan completed successfully for $$DIR."
            else
              echo "Skipping $$DIR (No .tf files found)."
            fi
            cd - > /dev/null
          else
            echo "Warning: Directory $$DIR was removed or does not exist."
          fi
        done
    id: 'terraform-plan'

# Top-level configuration
logsBucket: 'gs://build_logs_001'

options:
  logging: GCS_ONLY
